<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <!-- Background -->
  <rect width="1440" height="900" fill="#020617"/>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="1440" height="64" fill="#101218"/>
  <!-- Logo icon -->
  <rect x="24" y="14" width="64" height="36" rx="8" ry="8" fill="#050609" stroke="#38BDF8" stroke-width="2"/>
  <text x="36" y="40" fill="#E5E7EB" font-family="JetBrains Mono, monospace" font-size="16">&gt;_</text>
  <circle cx="72" cy="28" r="4" fill="#38BDF8"/>
  <circle cx="80" cy="36" r="4" fill="#38BDF8"/>

  <!-- Wordmark -->
  <text x="104" y="40" font-family="Inter, system-ui" font-size="22">
    <tspan fill="#38BDF8">WS</tspan><tspan fill="#E5E7EB">Term</tspan>
  </text>

  <!-- Device subtitle -->
  <text x="104" y="58" font-family="Inter, system-ui" font-size="12" fill="#9CA3AF">
    ESP32 • 192.168.0.218
  </text>

  <!-- Status badges -->
  <g font-family="Inter, system-ui" font-size="12">
    <!-- Connected -->
    <rect x="640" y="18" rx="999" ry="999" width="110" height="28" fill="#14532d"/>
    <text x="655" y="36" fill="#bbf7d0">● Connected</text>

    <!-- Free RAM -->
    <rect x="760" y="18" rx="999" ry="999" width="130" height="28" fill="#181b22"/>
    <text x="775" y="36" fill="#d1d5db">Free RAM: 217 MB</text>

    <!-- Version -->
    <rect x="902" y="18" rx="999" ry="999" width="120" height="28" fill="#181b22"/>
    <text x="917" y="36" fill="#d1d5db">v4.0.0-beta</text>
  </g>

  <!-- Header actions -->
  <g font-family="Inter, system-ui" font-size="13">
    <!-- Disconnect -->
    <rect x="1160" y="16" rx="999" ry="999" width="110" height="32" fill="#2563eb"/>
    <text x="1188" y="37" fill="#ffffff">Disconnect</text>
    <!-- Fullscreen icon button -->
    <rect x="1284" y="16" rx="16" ry="16" width="32" height="32" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <rect x="1292" y="24" width="16" height="8" fill="none" stroke="#e5e7eb" stroke-width="1.4"/>
  </g>

  <!-- Main layout: console + side panel -->
  <!-- Console container -->
  <rect x="24" y="88" width="980" height="680" rx="12" ry="12" fill="#050609" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Side panel container -->
  <rect x="1016" y="88" width="400" height="680" rx="12" ry="12" fill="#0b0f1a" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Console header -->
  <text x="44" y="120" font-family="Inter, system-ui" font-size="16" fill="#e5e7eb">Console</text>
  <!-- Auto-scroll toggle -->
  <rect x="120" y="105" width="40" height="20" rx="10" ry="10" fill="#22c55e"/>
  <circle cx="150" cy="115" r="8" fill="#ffffff"/>
  <text x="170" y="120" font-family="Inter, system-ui" font-size="12" fill="#e5e7eb">Auto-scroll</text>

  <!-- Search field -->
  <rect x="640" y="104" width="340" height="28" rx="6" ry="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="656" y="122" font-family="Inter, system-ui" font-size="12" fill="#6b7280">Filter logs…</text>
  <!-- magnifier -->
  <circle cx="952" cy="118" r="6" fill="none" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="956" y1="122" x2="961" y2="127" stroke="#6b7280" stroke-width="1.2"/>

  <!-- Sample log lines -->
  <g font-family="JetBrains Mono, monospace" font-size="12">
    <!-- line 1 -->
    <text x="44" y="154" fill="#9ca3af">12:34:12.345</text>
    <rect x="140" y="140" rx="10" ry="10" width="52" height="20" fill="rgba(34,197,94,0.12)" stroke="#22c55e" stroke-width="0.8"/>
    <text x="152" y="154" fill="#22c55e">INFO</text>
    <text x="210" y="154" fill="#e5e7eb">System initialized</text>

    <!-- line 2 -->
    <text x="44" y="178" fill="#9ca3af">12:34:12.876</text>
    <rect x="140" y="164" rx="10" ry="10" width="62" height="20" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="152" y="178" fill="#38bdf8">DEBUG</text>
    <text x="210" y="178" fill="#e5e7eb">Connecting to WiFi SSID "dev-net"</text>

    <!-- line 3 -->
    <text x="44" y="202" fill="#9ca3af">12:34:13.104</text>
    <rect x="140" y="188" rx="10" ry="10" width="52" height="20" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="152" y="202" fill="#38bdf8">DEBUG</text>
    <text x="210" y="202" fill="#e5e7eb">WebSocket opened at /ws</text>

    <!-- line 4 -->
    <text x="44" y="226" fill="#9ca3af">12:34:16.512</text>
    <rect x="140" y="212" rx="10" ry="10" width="52" height="20" fill="rgba(234,179,8,0.16)" stroke="#eab308" stroke-width="0.8"/>
    <text x="152" y="226" fill="#eab308">WARN</text>
    <text x="210" y="226" fill="#e5e7eb">High latency detected (215 ms)</text>

    <!-- line 5 -->
    <text x="44" y="250" fill="#9ca3af">12:34:20.983</text>
    <rect x="140" y="236" rx="10" ry="10" width="60" height="20" fill="rgba(248,113,113,0.16)" stroke="#f97373" stroke-width="0.8"/>
    <text x="152" y="250" fill="#f97373">ERROR</text>
    <text x="210" y="250" fill="#e5e7eb">WebSocket frame parse failed (code 1002)</text>

    <!-- additional faded lines -->
    <text x="44" y="280" fill="#4b5563">…</text>
  </g>

  <!-- Side panel content -->
  <text x="1036" y="120" font-family="Inter, system-ui" font-size="16" fill="#e5e7eb">Log levels</text>

  <!-- Level toggles -->
  <g font-family="Inter, system-ui" font-size="12">
    <!-- DEBUG -->
    <rect x="1036" y="132" rx="999" ry="999" width="80" height="26" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="1"/>
    <text x="1054" y="150" fill="#38bdf8">DEBUG</text>

    <!-- INFO -->
    <rect x="1128" y="132" rx="999" ry="999" width="72" height="26" fill="rgba(34,197,94,0.12)" stroke="#22c55e" stroke-width="1"/>
    <text x="1148" y="150" fill="#22c55e">INFO</text>

    <!-- WARN -->
    <rect x="1036" y="166" rx="999" ry="999" width="76" height="26" fill="rgba(234,179,8,0.16)" stroke="#eab308" stroke-width="1"/>
    <text x="1053" y="184" fill="#eab308">WARN</text>

    <!-- ERROR -->
    <rect x="1128" y="166" rx="999" ry="999" width="84" height="26" fill="rgba(248,113,113,0.16)" stroke="#f97373" stroke-width="1"/>
    <text x="1144" y="184" fill="#f97373">ERROR</text>
  </g>

  <!-- Filters section -->
  <text x="1036" y="220" font-family="Inter, system-ui" font-size="16" fill="#e5e7eb">Filters</text>
  <rect x="1036" y="232" rx="999" ry="999" width="110" height="26" fill="#111827"/>
  <text x="1048" y="250" font-family="Inter, system-ui" font-size="12" fill="#e5e7eb">module: relay</text>

  <rect x="1154" y="232" rx="999" ry="999" width="120" height="26" fill="#111827"/>
  <text x="1166" y="250" font-family="Inter, system-ui" font-size="12" fill="#e5e7eb">host: esp32-dev</text>

  <rect x="1036" y="268" rx="6" ry="6" width="90" height="26" fill="#1d4ed8"/>
  <text x="1050" y="286" font-family="Inter, system-ui" font-size="12" fill="#ffffff">Add filter</text>

  <!-- Device status -->
  <text x="1036" y="326" font-family="Inter, system-ui" font-size="16" fill="#e5e7eb">Device status</text>
  <text x="1036" y="348" font-family="Inter, system-ui" font-size="12" fill="#9ca3af">IP: 192.168.0.218</text>
  <text x="1036" y="366" font-family="Inter, system-ui" font-size="12" fill="#9ca3af">Uptime: 01:23:45</text>
  <text x="1036" y="384" font-family="Inter, system-ui" font-size="12" fill="#9ca3af">FW: wsterm-esp32-0.3.0</text>

  <!-- Memory bar -->
  <text x="1036" y="408" font-family="Inter, system-ui" font-size="12" fill="#e5e7eb">Free memory</text>
  <rect x="1036" y="416" width="320" height="10" rx="5" ry="5" fill="#111827"/>
  <rect x="1036" y="416" width="230" height="10" rx="5" ry="5" fill="#22c55e"/>

  <!-- Bottom toolbar -->
  <rect x="0" y="792" width="1440" height="68" fill="rgba(15,23,42,0.95)"/>
  <line x1="0" y1="792" x2="1440" y2="792" stroke="#111827" stroke-width="1"/>

  <!-- Bottom toolbar - left group -->
  <g font-family="Inter, system-ui" font-size="13">
    <!-- Pause -->
    <rect x="24" y="804" rx="999" ry="999" width="90" height="32" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="52" y="825" fill="#e5e7eb">Pause</text>

    <!-- Clear -->
    <rect x="122" y="804" rx="999" ry="999" width="90" height="32" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="150" y="825" fill="#e5e7eb">Clear</text>

    <!-- Copy -->
    <rect x="220" y="804" rx="999" ry="999" width="110" height="32" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="248" y="825" fill="#e5e7eb">Copy all</text>

    <!-- Export -->
    <rect x="338" y="804" rx="999" ry="999" width="110" height="32" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="368" y="825" fill="#e5e7eb">Export</text>
  </g>

  <!-- Bottom toolbar - right group -->
  <g font-family="Inter, system-ui" font-size="13">
    <!-- Font controls -->
    <rect x="920" y="804" rx="999" ry="999" width="40" height="32" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="933" y="825" fill="#e5e7eb">A-</text>

    <text x="970" y="825" fill="#9ca3af">13px</text>

    <rect x="1012" y="804" rx="999" ry="999" width="40" height="32" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <text x="1025" y="825" fill="#e5e7eb">A+</text>

    <!-- Theme toggle -->
    <rect x="1064" y="804" rx="999" ry="999" width="44" height="32" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="1084" cy="820" r="9" fill="#e5e7eb"/>

    <!-- Settings -->
    <rect x="1120" y="804" rx="999" ry="999" width="44" height="32" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="1142" cy="820" r="2" fill="#e5e7eb"/>
    <circle cx="1134" cy="820" r="2" fill="#e5e7eb"/>
    <circle cx="1150" cy="820" r="2" fill="#e5e7eb"/>
  </g>
</svg>
